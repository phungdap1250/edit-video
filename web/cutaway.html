<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyệt cutaway — AI Editor</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- review.js PHẢI nạp trước alpine.min.js: bản CDN của Alpine tự
       gọi Alpine.start() ngay khi document.readyState != 'loading',
       tức là TRƯỚC defer script kế tiếp — reviewPage() phải tồn tại sẵn. -->
  <script defer src="/static/review.js"></script>
  <script defer src="/static/alpine.min.js"></script>
</head>
<!--
  KHUNG TRỐNG CÓ CHỦ Ý. Bố cục lấy từ ui-demo/ (xem CLAUDE.md) — ui-demo/ rỗng
  nên đây là bản chức năng tối thiểu, đủ dữ liệu cho "Done khi" (PRD [JMP]),
  chưa phải bố cục cuối cùng.
-->
<body x-data="reviewPage('cutaway')" x-cloak>
  <header class="bar">
    <h1>Duyệt cutaway</h1>
    <div class="actions">
      <span class="budget" x-show="budget" x-text="budgetLabel()"></span>
      <span x-text="message"></span>
      <button @click="publish()">Xuất quyết định</button>
    </div>
  </header>

  <template x-if="conflicts.length">
    <section class="conflicts">
      <template x-for="c in conflicts" :key="c.id + c.field">
        <article class="conflict">
          <b x-text="c.id + ' · ' + c.field"></b>
          <button @click="resolveConflict(c, true)">Giữ bản của tôi</button>
          <button @click="resolveConflict(c, false)">Giữ bản của Claude</button>
        </article>
      </template>
    </section>
  </template>

  <main x-show="!loading">
    <template x-for="item in items" :key="item.id">
      <article class="item cutaway-item" :class="item.status">
        <template x-if="item.image_path">
          <img :src="media(item.image_path)" :alt="item.anchor_text" class="cutaway-thumb">
        </template>
        <span x-show="!item.image_path" class="cutaway-missing">chưa có ảnh</span>
        <div class="cutaway-meta">
          <span class="anchor-text" x-text="item.anchor_text"></span>
          <span class="reason" x-text="item.image_source || 'chưa xử lý'"></span>
          <span class="tier" x-text="'sinh lại ' + (item.regen_count ?? 0) + '/' + (item.regen_limit ?? '?')"></span>
        </div>
        <button @click="setStatus(item, 'accepted')" :disabled="item.status === 'accepted'">Giữ</button>
        <button @click="setStatus(item, 'rejected')" :disabled="item.status === 'rejected'">Bỏ</button>
        <button
          @click="regenerate(item)"
          :disabled="(item.regen_count ?? 0) >= (item.regen_limit ?? 0)"
        >Sinh lại</button>
      </article>
    </template>
  </main>
</body>
</html>
