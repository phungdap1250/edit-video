<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyệt đồ hoạ — AI Editor</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- review.js PHẢI nạp trước alpine.min.js: bản CDN của Alpine tự
       gọi Alpine.start() ngay khi document.readyState != 'loading',
       tức là TRƯỚC defer script kế tiếp — reviewPage() phải tồn tại sẵn. -->
  <script defer src="/static/review.js"></script>
  <script defer src="/static/alpine.min.js"></script>
</head>
<!--
  KHUNG TRỐNG CÓ CHỦ Ý. Bố cục lấy từ ui-demo/ (xem CLAUDE.md) — ui-demo/ rỗng
  nên đây là bản chức năng tối thiểu, đủ dữ liệu cho "Done khi" (PRD [MGX]),
  chưa phải bố cục cuối cùng. Mỗi thẻ là 1 <iframe> nạp đúng file
  hf/scenes/<id>.html — composition độc lập TỰ PHÁT ĐƯỢC (video controls thật,
  có tiếng, tua được, GSAP timeline riêng đồng bộ theo video đang phát).
-->
<body x-data="reviewPage('storyboard')" x-cloak>
  <header class="bar">
    <h1>Duyệt đồ hoạ</h1>
    <div class="actions">
      <span class="playall-status" x-show="playingAll" x-text="`Đang phát ${playAllIndex + 1}/${items.length}`"></span>
      <button @click="playAll()" x-text="playingAll ? 'Dừng' : 'Phát toàn bộ liên tục'"></button>
      <span x-text="message"></span>
      <button @click="publish()">Xuất quyết định</button>
    </div>
  </header>

  <template x-if="conflicts.length">
    <section class="conflicts">
      <template x-for="c in conflicts" :key="c.id + c.field">
        <article class="conflict">
          <b x-text="c.id + ' · ' + c.field"></b>
          <button @click="resolveConflict(c, true)">Giữ bản của tôi</button>
          <button @click="resolveConflict(c, false)">Giữ bản của Claude</button>
        </article>
      </template>
    </section>
  </template>

  <main x-show="!loading">
    <template x-for="item in items" :key="item.id">
      <article class="item overlay-item" :class="item.status">
        <div class="overlay-frame-wrap">
          <iframe
            :src="media('hf/scenes/' + item.id + '.html')"
            class="overlay-frame"
            loading="lazy"
            @load="fitOverlayFrame($event)"
          ></iframe>
        </div>
        <div class="overlay-meta">
          <span class="anchor-text" x-text="item.anchor_text"></span>
          <span class="reason" x-text="item.type"></span>
          <textarea
            class="overlay-content-edit"
            :value="JSON.stringify(item.content, null, 2)"
            @change="editContent(item, $event.target.value)"
          ></textarea>
        </div>
        <button @click="setStatus(item, 'approved')" :disabled="item.status === 'approved'">Giữ</button>
        <button @click="setStatus(item, 'rejected')" :disabled="item.status === 'rejected'">Bỏ</button>
      </article>
    </template>
  </main>
</body>
</html>
